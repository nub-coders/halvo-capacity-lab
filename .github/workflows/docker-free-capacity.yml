name: docker-free-capacity

# Manual only. Native-vs-docker paired request-capacity gate on KVM-capable
# hosted runners. Each matrix job runs BOTH backends on the same runner, so the
# pairing is same-host. Measurement only; no production or Docker change.
on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: "Paired repetitions (each job = native+docker on one runner)"
        type: choice
        options: ["3", "1", "2"]
        default: "3"

permissions:
  contents: read

concurrency:
  group: docker-free-capacity
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      reps: ${{ steps.m.outputs.reps }}
    steps:
      - id: m
        run: |
          case "${{ inputs.repetitions }}" in
            1) reps='[1]' ;;
            2) reps='[1,2]' ;;
            *) reps='[1,2,3]' ;;
          esac
          echo "reps=$reps" >> "$GITHUB_OUTPUT"

  capacity:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        rep: ${{ fromJSON(needs.plan.outputs.reps) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      LAB: /var/tmp/halvo-native-vm-cap-${{ matrix.rep }}
    steps:
      - uses: actions/checkout@v4

      - name: Require usable KVM (TCG capacity is not a valid gate per the runbook)
        run: |
          sudo sh -c '[ -r /dev/kvm ] && [ -w /dev/kvm ]' \
            || { echo "No usable /dev/kvm for root; refusing to run an invalid TCG trial."; exit 1; }
          ls -l /dev/kvm

      - name: Reclaim disk for the guests
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo docker system prune -af || true
          df -h /

      - name: Freeze a self-consistent source manifest
        working-directory: scripts/native-lab
        run: |
          rm -f SHA256SUMS
          sha256sum *.py *.sh *.json *.policy *.Dockerfile > SHA256SUMS
          sha256sum -c SHA256SUMS >/dev/null && echo "manifest self-verifies"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

      - name: Native capacity trial
        run: sudo -E bash scripts/native-lab/vm-capacity.sh --external-capacity-native "${LAB}-native"

      - name: Stash native results (logs always, then validate report)
        if: always()
        run: |
          sudo cp -r "${LAB}-native/results" "artifacts/rep${{ matrix.rep }}-native-results" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" artifacts || true
          r=$(ls -1 "artifacts/rep${{ matrix.rep }}-native-results"/*/capacity-external.json 2>/dev/null | tail -n1)
          test -n "$r" || { echo "no native report produced (see uploaded *-native-results logs)"; exit 1; }
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['scope']=='request-capacity' and d['passed'] and d['collection_valid'], d.get('errors'); print('native trial OK: capacity_rps=%s evidence=%s' % (d['capacity_rps'], d['capacity_evidence']))" "$r"
          cp "$r" "artifacts/rep${{ matrix.rep }}-native.json"
          sudo cp "${LAB}-native/results"/*/launcher-cleanup.json "artifacts/rep${{ matrix.rep }}-native-launcher-cleanup.json"
          sudo rm -rf "${LAB}-native"

      - name: Docker capacity trial
        run: sudo -E bash scripts/native-lab/vm-capacity.sh --external-capacity-docker "${LAB}-docker"

      - name: Stash docker results (logs always, then validate report)
        if: always()
        run: |
          sudo cp -r "${LAB}-docker/results" "artifacts/rep${{ matrix.rep }}-docker-results" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" artifacts || true
          r=$(ls -1 "artifacts/rep${{ matrix.rep }}-docker-results"/*/capacity-external.json 2>/dev/null | tail -n1)
          test -n "$r" || { echo "no docker report produced (see uploaded *-docker-results logs)"; exit 1; }
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['scope']=='request-capacity' and d['passed'] and d['collection_valid'], d.get('errors'); print('docker trial OK: capacity_rps=%s evidence=%s' % (d['capacity_rps'], d['capacity_evidence']))" "$r"
          cp "$r" "artifacts/rep${{ matrix.rep }}-docker.json"
          sudo cp "${LAB}-docker/results"/*/launcher-cleanup.json "artifacts/rep${{ matrix.rep }}-docker-launcher-cleanup.json"
          sudo rm -rf "${LAB}-docker"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capacity-rep-${{ matrix.rep }}
          path: artifacts/
          if-no-files-found: warn

  aggregate:
    needs: capacity
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: capacity-rep-*
          path: reports
          merge-multiple: true
      - name: Validate the gate and compare the pairs
        run: |
          ls -1 reports/*.json
          # Every trial must have launched and shut down gracefully; receipts are
          # byte-identical fixed JSON, so one shared sibling satisfies the validator.
          sums=$(sha256sum reports/rep*-launcher-cleanup.json | awk '{print $1}' | sort -u)
          test "$(echo "$sums" | wc -l)" = 1 || { echo "launcher cleanup receipts differ"; exit 1; }
          cp "$(ls reports/rep*-launcher-cleanup.json | head -n1)" reports/launcher-cleanup.json
          set -o pipefail
          python3 scripts/native-lab/capacity_external_validate.py reports/*.json | tee gate-validation.json
          python3 scripts/native-lab/capacity_compare.py reports/*.json | tee comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capacity-comparison
          path: |
            comparison.json
            gate-validation.json
          if-no-files-found: warn
